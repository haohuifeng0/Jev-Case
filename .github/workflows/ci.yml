name: Jev-Case CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CI configuration and order
        run: npm run test:ci-config

      - name: Validate business definition
        run: npm run validate:business

      - name: Validate data
        run: npm run validate:data

      - name: Check Astro project
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
